<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — ELM</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Create Account</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
</div>
</body>
</html>
